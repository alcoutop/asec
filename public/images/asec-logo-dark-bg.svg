          font-weight="900" font-size="44" letter-spacing="-1">
      <tspan fill="#FFFFFF">A</tspan><tspan fill="#00B0F0">C</tspan>
    </text>
  </g>

  <!-- Wordmark: 'A' (#FFFFFF Bold) + 'sec' (#00B0F0 Regular/SemiBold) -->
