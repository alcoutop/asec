  </text>

  <!-- Tagline / Descriptor -->
  <text x="146" y="122" fill="#B8CBE0"
        font-family="Inter, Segoe UI, Calibri, sans-serif"
        font-weight="500" font-size="15" letter-spacing="1.2">
    SEGURANÇA DA INFORMAÇÃO &amp; INFRAESTRUTURA
