      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00B0F0" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- AC Shield Icon -->
  <g transform="translate(10, 10)">
    <path d="M56 6 L104 22 L104 64 C104 92 82 112 56 124 C30 112 8 92 8 64 L8 22 Z"
