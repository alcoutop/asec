<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" fill="none">
  <!-- Background optional preview (transparent for easy overlay on #0B2545 / #051428) -->
  <!-- Shield Icon (Cyber Cyan #00B0F0 outline with faceted top and pointed base) -->
  <g transform="translate(12, 12)">
    <path d="M52 6 L96 20 L96 58 C96 84 76 102 52 114 C28 102 8 84 8 58 L8 20 Z"
          fill="#081C36" stroke="#00B0F0" stroke-width="7.5" stroke-linejoin="round"/>
    <!-- Letter 'A' inside shield -->
    <text x="52" y="73" text-anchor="middle" fill="#FFFFFF"
          font-family="Segoe UI, Calibri, Inter, Arial, sans-serif"
          font-weight="800" font-size="44">A</text>
  </g>

  <!-- Wordmark: 'A' (#FFFFFF Bold) + 'sec' (#00B0F0 Regular/SemiBold) -->
  <text x="132" y="88" font-family="Segoe UI, Calibri, Inter, Arial, sans-serif" font-size="76">
    <tspan fill="#FFFFFF" font-weight="800">A</tspan><tspan fill="#00B0F0" font-weight="500">sec</tspan>
  </text>

  <!-- Descriptor / Tagline -->
  <text x="135" y="118" fill="#B8CBE0"
        font-family="Segoe UI, Calibri, Inter, Arial, sans-serif"
        font-weight="400" font-size="15.5" letter-spacing="1.4">
    SEGURANÇA DA INFORMAÇÃO &amp; INFRAESTRUTURA
  </text>
</svg>
