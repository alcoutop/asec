<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 148" width="385" height="148" fill="none">
  <defs>
    <filter id="shieldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00B0F0" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="shieldFill" x1="66" y1="8" x2="66" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D2E57"/>
      <stop offset="100%" stop-color="#051428"/>
    </linearGradient>
    <linearGradient id="cyanEdge" x1="12" y1="8" x2="120" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47CEFF"/>
      <stop offset="50%" stop-color="#00B0F0"/>
      <stop offset="100%" stop-color="#0070C0"/>
    </linearGradient>
  </defs>

  <!-- Prominent AC Cyber Shield Icon -->
  <g>
    <!-- Outer Glowing Shield -->
    <path d="M66 10 L120 28 L120 74 C120 107 95 128 66 140 C37 128 12 107 12 74 L12 28 Z"
          fill="url(#shieldFill)" stroke="url(#cyanEdge)" stroke-width="8.5" stroke-linejoin="round" filter="url(#shieldGlow)"/>
    <!-- Inner Subtle Shield Perimeter -->
    <path d="M66 20 L110 35 L110 73 C110 100 90 117 66 128 C42 117 22 100 22 73 L22 35 Z"
          fill="none" stroke="#00B0F0" stroke-width="1.5" stroke-opacity="0.38" stroke-linejoin="round"/>
    <!-- Bold AC Monogram -->
    <text x="66" y="92" text-anchor="middle"
          font-family="Inter, Segoe UI, Calibri, sans-serif"
          font-weight="900" font-size="52" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">A</tspan><tspan fill="#00B0F0">C</tspan>
    </text>
  </g>

  <!-- Wordmark: 'A' (#FFFFFF Bold) + 'sec' (#00B0F0 SemiBold) -->
  <text x="142" y="92" font-family="Inter, Segoe UI, Calibri, sans-serif" font-size="86" letter-spacing="-1.5">
    <tspan fill="#FFFFFF" font-weight="900">A</tspan><tspan fill="#00B0F0" font-weight="600">sec</tspan>
  </text>

  <!-- Tagline aligned cleanly beneath Wordmark -->
  <text x="145" y="122" fill="#B8CBE0"
        font-family="Inter, Segoe UI, Calibri, sans-serif"
        font-weight="600" font-size="12.5" letter-spacing="1.4">
    SEGURANÇA &amp; INFRAESTRUTURA
  </text>
</svg>
