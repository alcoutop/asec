<header class="sticky top-0 z-50 w-full text-white" style="background-color: rgba(8, 28, 54, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 176, 240, 0.25);">
    <div x-data="{ open: false }" class="max-w-7xl px-4 mx-auto sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <!-- Official Asec Logo with strict dimensions -->
            <a href="{{ "/" | relURL }}" class="flex items-center focus:outline-none" aria-label="Asec — Segurança da Informação & Infraestrutura">
                <img src="{{ "/images/asec-logo-dark-bg.svg" | relURL }}" alt="Asec — Segurança da Informação & Infraestrutura" class="asec-header-logo" width="220" height="44" />
            </a>

            <!-- Mobile Hamburger Button -->
            <button class="p-2 rounded-lg md:hidden text-gray-200 hover:text-[#00B0F0] focus:outline-none" @click="open = !open" aria-label="Menu Principal">
                <svg fill="currentColor" viewBox="0 0 20 20" class="w-7 h-7">
                    <path x-show="!open" fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM9 15a1 1 0 011-1h6a1 1 0 110 2h-6a1 1 0 01-1-1z" clip-rule="evenodd"></path>
                    <path x-show="open" fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
            </button>

            <!-- Desktop Navigation Links -->
            <nav class="hidden md:flex md:items-center md:space-x-1 lg:space-x-3">
                <a class="px-3 py-2 text-sm font-semibold text-gray-200 rounded-lg hover:text-[#00B0F0] hover:bg-white/5 transition-colors" href="{{ "/" | relURL }}">
                    Início
                </a>
                <a class="px-3 py-2 text-sm font-semibold text-gray-200 rounded-lg hover:text-[#00B0F0] hover:bg-white/5 transition-colors" href="{{ "/#problema" | relURL }}">
                    O Problema
                </a>
                <a class="px-3 py-2 text-sm font-semibold text-gray-200 rounded-lg hover:text-[#00B0F0] hover:bg-white/5 transition-colors" href="{{ "/#solucoes" | relURL }}">
                    Soluções
                </a>
                <a class="px-3 py-2 text-sm font-semibold text-gray-200 rounded-lg hover:text-[#00B0F0] hover:bg-white/5 transition-colors" href="{{ "/#estrategia-321" | relURL }}">
                    Estratégia 3-2-1
                </a>
                <a class="px-3 py-2 text-sm font-semibold text-gray-200 rounded-lg hover:text-[#00B0F0] hover:bg-white/5 transition-colors" href="{{ "/#defesa" | relURL }}">
                    Defesa em Camadas
                </a>

                <!-- Dropdown Artigos -->
                <div @click.away="openDrop = false" class="relative" x-data="{ openDrop: false }">
                    <button @click="openDrop = !openDrop" class="flex items-center px-3 py-2 text-sm font-semibold text-gray-200 rounded-lg hover:text-[#00B0F0] hover:bg-white/5 focus:outline-none transition-colors">
                        <span>Artigos</span>
                        <svg fill="currentColor" viewBox="0 0 20 20" :class="{'rotate-180': openDrop, 'rotate-0': !openDrop}" class="w-4 h-4 ml-1 transition-transform duration-200">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                    <div x-show="openDrop" x-transition class="absolute right-0 z-40 w-72 mt-2 origin-top-right rounded-xl shadow-2xl bg-[#081C36] border border-[#00B0F0]/30 py-2">
                        <a class="block px-4 py-2.5 text-xs font-semibold text-gray-200 hover:bg-[#00B0F0]/15 hover:text-[#00B0F0] transition-colors" href="{{ "/posts/01-ultima-linha-de-defesa/" | relURL }}">
                            🛡️ A Última Linha de Defesa
                        </a>
                        <a class="block px-4 py-2.5 text-xs font-semibold text-gray-200 hover:bg-[#00B0F0]/15 hover:text-[#00B0F0] transition-colors" href="{{ "/posts/02-estrategia-backup-3-2-1/" | relURL }}">
                            📦 Estratégia de Backup 3-2-1
                        </a>
                        <a class="block px-4 py-2.5 text-xs font-semibold text-gray-200 hover:bg-[#00B0F0]/15 hover:text-[#00B0F0] transition-colors" href="{{ "/posts/03-zero-trust-protecao-dados/" | relURL }}">
                            🔒 Zero Trust &amp; Proteção de Dados
                        </a>
                    </div>
                </div>

                <a class="px-3 py-2 text-sm font-semibold text-gray-200 rounded-lg hover:text-[#00B0F0] hover:bg-white/5 transition-colors" href="{{ "/sobre/" | relURL }}">
                    Sobre
                </a>

                <a href="{{ "/contato/" | relURL }}" class="ml-3 px-4 py-2 text-xs font-bold rounded-lg asec-btn-primary">
                    Solicitar Diagnóstico
                </a>
            </nav>
        </div>

        <!-- Mobile Drawer -->
        <div x-show="open" x-transition class="md:hidden pb-5 pt-2 border-t border-[#00B0F0]/20 space-y-1">
            <a class="block px-3 py-2 text-base font-semibold text-gray-200 rounded-lg hover:bg-white/5 hover:text-[#00B0F0]" href="{{ "/" | relURL }}">
                Início
            </a>
            <a class="block px-3 py-2 text-base font-semibold text-gray-200 rounded-lg hover:bg-white/5 hover:text-[#00B0F0]" href="{{ "/#problema" | relURL }}">
                O Problema
            </a>
            <a class="block px-3 py-2 text-base font-semibold text-gray-200 rounded-lg hover:bg-white/5 hover:text-[#00B0F0]" href="{{ "/#solucoes" | relURL }}">
                Soluções
            </a>
            <a class="block px-3 py-2 text-base font-semibold text-gray-200 rounded-lg hover:bg-white/5 hover:text-[#00B0F0]" href="{{ "/#estrategia-321" | relURL }}">
                Estratégia 3-2-1
            </a>
            <a class="block px-3 py-2 text-base font-semibold text-gray-200 rounded-lg hover:bg-white/5 hover:text-[#00B0F0]" href="{{ "/#defesa" | relURL }}">
                Defesa em Camadas
            </a>
            <a class="block px-3 py-2 text-base font-semibold text-gray-200 rounded-lg hover:bg-white/5 hover:text-[#00B0F0]" href="{{ "/sobre/" | relURL }}">
                Sobre
            </a>
            <a class="block px-3 py-2 text-base font-semibold text-gray-200 rounded-lg hover:bg-white/5 hover:text-[#00B0F0]" href="{{ "/contato/" | relURL }}">
                Contato
            </a>
            <div class="pt-3 px-3">
                <a href="{{ "/contato/" | relURL }}" class="block w-full text-center px-4 py-3 rounded-lg asec-btn-primary">
                    Solicitar Diagnóstico
                </a>
            </div>
        </div>
    </div>
</header>
