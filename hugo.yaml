baseURL: 'https://www.asec.com.br/'
title: Asec
theme: "tailbliss"
languageCode: pt-br
DefaultContentLanguage: pt-br
enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
canonifyURLs: false
paginate: 9
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

params:
  author: "Asec — Segurança da Informação & Infraestrutura"
  moto: "Segurança da Informação & Infraestrutura"
  tagline: "SEGURANÇA DA INFORMAÇÃO & INFRAESTRUTURA"
  description: "Sua última linha de defesa contra Ransomware. Proteção de dados corporativos com imutabilidade estrita, estratégia 3-2-1 e arquitetura Zero Trust."
  og_image: "/images/asec-logo-dark-bg.png"
  email: "contato@asec.com.br"
  noc_email: "noc@asec.com.br"
  domain: "www.asec.com.br"
  disable_theme_toggle: true
  disable_stay_uptodate: false

  p4:
    heading: "Insights & Engenharia de Segurança"
    content:
      - text: "Artigos estratégicos sobre proteção de dados, imutabilidade, estratégia 3-2-1 e resiliência cibernética corporativa."

  p5:
    heading: "Pronto para blindar os dados críticos da sua empresa?"
    content:
      - text: "Solicite um diagnóstico confidencial de proteção de dados e descubra como implementar uma última linha de defesa 100% imutável."
    action: "https://formspree.io/f/movlrpne"
    label: "E-mail corporativo"
    placeholder: "seu.nome@empresa.com.br"
    button: "Solicitar Diagnóstico"

  social_media:
    github:
      enabled: false
      url: 'https://github.com/alcoutop/asec'
    facebook:
      enabled: false
      url: '#'
    instagram:
      enabled: false
      url: '#'
    twitter:
      enabled: false
      url: '#'

